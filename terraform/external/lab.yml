ciuser: ubuntu
fqdn: dcclab.lan
dns: ["10.0.0.1"]
storage:
  local:
    ssd: 0
  local-zfs:
    ssd: 1
  unraid:
    ssd: 0
  unraidNFS:
    ssd: 0
templates:
  noble_cloud:
    name: ubuntu-24.04-server-cloudimg-amd64
    disk0_size: "20G"
    vm_id: 9000
  noble_iso:
    name: ubuntu-24.04-tmpl
    disk0_size: "20G"
    vm_id: 200
tz: America/Chicago
nodes:
  - pve
  - pve2
  - pve3
  - pve4
users:
  terraform-prov@pve:
    groups: terraform
  packer@pve:
    groups: packer
acls:
  terraform:
    privileges:
    - VM.Allocate
    - VM.Clone
    - VM.Config.CDROM
    - VM.Config.CPU
    - VM.Config.Cloudinit
    - VM.Config.Disk
    - VM.Config.HWType
    - VM.Config.Memory
    - VM.Config.Network
    - VM.Config.Options
    - VM.Monitor
    - VM.Audit
    - VM.PowerMgmt
    - Datastore.AllocateSpace
    - Datastore.Audit
    - SDN.Use
  packer:
    privileges:
      - VM.Config.Disk
      - VM.Config.CPU
      - VM.Config.Memory
      - Datastore.AllocateSpace
      - Sys.Modify
      - VM.Config.Options
      - VM.Allocate
      - VM.Audit
      - VM.Console
      - VM.Config.CDROM
      - VM.Config.Network
      - VM.PowerMgmt
      - VM.Config.HWType
      - VM.Monitor
