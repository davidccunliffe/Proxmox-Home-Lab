---
# 02-k8s-bootstrap.yml
#
# Bootstraps a Kubernetes cluster using kubeadm with Calico CNI.
#
# Prerequisites:
#   - K8s VMs deployed via Terraform (cloud-init installed containerd, kubeadm, kubelet)
#   - MikroTik VRRP active (gateway + K8s API load balancer on port 6443)
#   - Bind9 DNS resolving k8s-api.lab.davidccunliffe.pro -> 172.16.0.1
#
# Usage:
#   ansible-playbook playbooks/02-k8s-bootstrap.yml
#
# This playbook:
#   1. Initializes the first control plane node with kubeadm
#   2. Installs Calico CNI
#   3. Joins remaining control plane nodes
#   4. Joins worker nodes
#   5. Saves kubeconfig locally

- name: Initialize first control plane node
  hosts: k8s-cp-1
  gather_facts: true

  vars:
    kubeconfig_local: "{{ playbook_dir }}/../kubeconfig"

  tasks:
    - name: Check if cluster is already initialized
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: kubeadm_init_check

    - name: Initialize kubeadm on first control plane
      ansible.builtin.command: >
        kubeadm init
        --control-plane-endpoint "{{ k8s_api_endpoint }}:6443"
        --upload-certs
        --pod-network-cidr "{{ pod_cidr }}"
        --service-cidr "{{ service_cidr }}"
        --kubernetes-version "v{{ k8s_version }}.0"
      register: kubeadm_init
      when: not kubeadm_init_check.stat.exists

    - name: Create .kube directory
      ansible.builtin.file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy admin kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        remote_src: true
        owner: ubuntu
        group: ubuntu
        mode: "0600"

    - name: Save kubeconfig locally
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: "{{ kubeconfig_local }}"
        flat: true

    - name: Update kubeconfig server address for local use
      ansible.builtin.replace:
        path: "{{ kubeconfig_local }}"
        regexp: "https://.*:6443"
        replace: "https://{{ k8s_api_endpoint }}:6443"
      delegate_to: localhost
      become: false

    - name: Install Calico operator
      ansible.builtin.command: >
        kubectl create -f https://raw.githubusercontent.com/projectcalico/calico/v{{ calico_version }}/manifests/tigera-operator.yaml
      become: false
      become_user: ubuntu
      failed_when: false

    - name: Create Calico custom resources
      ansible.builtin.copy:
        content: |
          apiVersion: operator.tigera.io/v1
          kind: Installation
          metadata:
            name: default
          spec:
            calicoNetwork:
              ipPools:
              - name: default-ipv4-ippool
                blockSize: 26
                cidr: {{ pod_cidr }}
                encapsulation: VXLANCrossSubnet
                natOutgoing: Enabled
                nodeSelector: all()
            registry: quay.io
          ---
          apiVersion: operator.tigera.io/v1
          kind: APIServer
          metadata:
            name: default
          spec: {}
        dest: /tmp/calico-custom-resources.yaml
        mode: "0644"

    - name: Apply Calico custom resources
      ansible.builtin.command: kubectl apply -f /tmp/calico-custom-resources.yaml
      become: false
      become_user: ubuntu

    - name: Wait for Calico to be ready
      ansible.builtin.command: kubectl wait --for=condition=Available tigerastatus/calico --timeout=300s
      become: false
      become_user: ubuntu
      retries: 5
      delay: 10
      register: calico_ready
      until: calico_ready.rc == 0

    - name: Generate certificate key for control plane join
      ansible.builtin.command: kubeadm init phase upload-certs --upload-certs
      register: cert_key_output

    - name: Extract certificate key
      ansible.builtin.set_fact:
        certificate_key: "{{ cert_key_output.stdout_lines[-1] }}"

    - name: Generate join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_command

    - name: Set join facts
      ansible.builtin.set_fact:
        kubeadm_join_command: "{{ join_command.stdout }}"
        kubeadm_certificate_key: "{{ certificate_key }}"


- name: Join additional control plane nodes
  hosts: k8s_control_plane:!k8s-cp-1
  gather_facts: true
  serial: 1

  tasks:
    - name: Check if already joined
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_check

    - name: Join control plane
      ansible.builtin.command: >
        {{ hostvars['k8s-cp-1']['kubeadm_join_command'] }}
        --control-plane
        --certificate-key {{ hostvars['k8s-cp-1']['kubeadm_certificate_key'] }}
      when: not kubelet_check.stat.exists

    - name: Create .kube directory
      ansible.builtin.file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy admin kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        remote_src: true
        owner: ubuntu
        group: ubuntu
        mode: "0600"


- name: Join worker nodes
  hosts: k8s_workers
  gather_facts: true

  tasks:
    - name: Check if already joined
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_check

    - name: Join worker
      ansible.builtin.command: "{{ hostvars['k8s-cp-1']['kubeadm_join_command'] }}"
      when: not kubelet_check.stat.exists


- name: Verify cluster
  hosts: k8s-cp-1
  gather_facts: false

  tasks:
    - name: Wait for all nodes to be Ready
      ansible.builtin.shell: |
        kubectl get nodes --no-headers | grep -v Ready | wc -l
      become: false
      become_user: ubuntu
      register: not_ready
      until: not_ready.stdout | int == 0
      retries: 30
      delay: 10

    - name: Display cluster status
      ansible.builtin.command: kubectl get nodes -o wide
      become: false
      become_user: ubuntu
      register: cluster_status

    - name: Show cluster
      ansible.builtin.debug:
        msg: "{{ cluster_status.stdout_lines }}"
