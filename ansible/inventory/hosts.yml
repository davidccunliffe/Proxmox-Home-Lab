---
all:
  vars:
    ansible_user: ubuntu
    ansible_python_interpreter: /usr/bin/python3
    domain: lab.davidccunliffe.pro
    gateway: 172.16.0.1
    dns_servers:
      - 172.16.0.20
      - 172.16.0.21

  children:
    proxmox:
      hosts:
        pve:
          ansible_host: 192.168.189.10
          ansible_user: root
        pve2:
          ansible_host: 192.168.189.20
          ansible_user: root
        pve3:
          ansible_host: 192.168.189.30
          ansible_user: root
        pve4:
          ansible_host: 192.168.189.40
          ansible_user: root

    mikrotik:
      vars:
        ansible_connection: network_cli
        ansible_network_os: routeros
      hosts:
        mikrotik-1:
          ansible_host: 172.16.0.2
        mikrotik-2:
          ansible_host: 172.16.0.3

    vault:
      hosts:
        vault-1:
          ansible_host: 172.16.0.10
          vault_node_id: vault-1
        vault-2:
          ansible_host: 172.16.0.11
          vault_node_id: vault-2
        vault-3:
          ansible_host: 172.16.0.12
          vault_node_id: vault-3

    dns:
      hosts:
        dns-1:
          ansible_host: 172.16.0.20
          bind9_role: primary
        dns-2:
          ansible_host: 172.16.0.21
          bind9_role: secondary

    k8s_control_plane:
      hosts:
        k8s-cp-1:
          ansible_host: 172.16.1.10
        k8s-cp-2:
          ansible_host: 172.16.1.11
        k8s-cp-3:
          ansible_host: 172.16.1.12

    k8s_workers:
      hosts:
        k8s-worker-1:
          ansible_host: 172.16.1.20
        k8s-worker-2:
          ansible_host: 172.16.1.21
        k8s-worker-3:
          ansible_host: 172.16.1.22

    k8s:
      children:
        k8s_control_plane:
        k8s_workers:
